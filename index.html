<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarX — Legal</title>
  <meta name="description" content="Privacy Policy and Terms of Service for the CarX Android app.">
  <style>
    :root { color-scheme: dark; --bg:#0b0d11; --card:#161a22; --text:#e7ebf3; --muted:#98a2b3; --accent:#3e8bff; --violet:#b15cff; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; background: radial-gradient(1200px 600px at 80% -10%, #241a44 0%, transparent 60%), radial-gradient(900px 500px at 10% 10%, #102144 0%, transparent 55%), var(--bg); color:var(--text); font:16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width:100%; max-width: 720px; margin:0 auto; padding:64px 20px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.4px; color:var(--muted); font-size:14px; text-transform:uppercase; }
    .dot { width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--violet)); box-shadow:0 0 18px #3e8bff88; }
    h1 { font-size: clamp(30px, 6vw, 46px); line-height:1.05; margin:18px 0 10px; letter-spacing:-1px; }
    .meta { color:var(--muted); font-size:14px; margin-bottom:32px; }
    .cards { display:grid; gap:14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    a.card { display:block; background:var(--card); border:1px solid #ffffff14; border-radius:18px; padding:22px; text-decoration:none; color:var(--text); transition: border-color .18s ease, transform .18s ease; }
    a.card:hover { border-color:#3e8bff88; transform: translateY(-2px); }
    a.card h2 { font-size:19px; margin:0 0 6px; }
    a.card p { margin:0; color:var(--muted); font-size:14px; }
    footer { margin-top:36px; color:var(--muted); font-size:14px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <div class="brand"><span class="dot"></span> CarX</div>
  <h1>Legal</h1>
  <div class="meta">Android app <code>com.markjosephbolivar.carx</code> · Developer: Mark Joseph Bolivar</div>

  <div class="cards">
    <a class="card" href="privacy-policy.html">
      <h2>Privacy Policy</h2>
      <p>What CarX collects, how photos and prompts are handled, and your choices.</p>
    </a>
    <a class="card" href="terms.html">
      <h2>Terms of Service</h2>
      <p>The rules for using CarX, including AI output limitations.</p>
    </a>
  </div>

  <footer>
    Questions? <a href="mailto:markjosephdev08@gmail.com">markjosephdev08@gmail.com</a>
  </footer>
</main>
</body>
</html>
